<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarmWiz Chat</title><style>
:root{--green:#1b5e20;--muted:#64748b;--line:#dbe5d5}*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0;background:#fff}body{font-family:Roboto,Arial,sans-serif;color:#1f2933;overflow-x:hidden}.panel{width:100%;max-width:100vw;padding:16px;min-height:100%;overflow:visible}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}.title{margin:3px 0 6px;color:var(--green);font-size:clamp(20px,2.4vw,28px);font-weight:700}.intro{max-width:100%;margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.prompts button,.controls button{border:1px solid #b9d59e;border-radius:7px;padding:8px 10px;background:#f1f8e9;color:var(--green);font-weight:700;cursor:pointer}.form{display:grid;gap:8px}.form textarea{width:100%;min-height:74px;resize:vertical;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:7px}.row select,.row button{min-height:40px}.row select{flex:1 1 120px;border:1px solid #cbd5e1;border-radius:7px;padding:8px;font:inherit}.row button{border:0;border-radius:7px;padding:9px 13px;background:#2e7d32;color:#fff;font-weight:700;cursor:pointer}.row button.secondary{background:#607d66}.answer{max-height:260px;overflow-y:auto;overflow-x:hidden;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#f8fbf4;line-height:1.5;font-size:14px;white-space:normal;overflow-wrap:anywhere}.answer strong{color:var(--green)}.status{margin-top:7px;color:var(--muted);font-size:12px}@media(max-width:520px){.panel{padding:12px}.prompts button{flex:1 1 100%;text-align:left}.row>*{flex:1 1 100%}}
</style></head><body><main class="panel"><div class="eyebrow">FARMWIZ FIELD ADVISER</div><div class="title">Ask the farm</div><p class="intro">FarmWiz combines live readings, history, crop context, and weather.</p><div class="prompts"><button type="button" data-q="How is my farm doing?">How is my farm doing?</button><button type="button" data-q="What should I investigate first today?">What should I investigate first?</button><button type="button" data-q="Are any devices offline or stale?">Are any devices offline?</button></div><form id="chat" class="form"><textarea id="message" maxlength="2000">How is my farm doing?</textarea><div class="row"><select id="provider" aria-label="AI provider"><option value="local_icm">Local agent</option><option value="gemini">Gemini</option></select><button type="button" id="listen" class="secondary">🎙 Speak</button><button type="submit">Ask FarmWiz</button><button type="button" id="speak" class="secondary">🔊 Read aloud</button></div></form><div id="status" class="status">Ready</div><article id="answer" class="answer"><strong>FarmWiz</strong><br>Ask a question to get an evidence-based farm briefing.</article></main><script>
(function(){var origin='https://dash.farmwiz.net',msg=document.getElementById('message'),provider=document.getElementById('provider'),answer=document.getElementById('answer'),status=document.getElementById('status'),recognition=null,last='';function height(){var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);if(window.parent!==window)window.parent.postMessage({type:'farmwiz-chat-resize',height:h},origin)}function profile(){try{return JSON.parse(localStorage.getItem('farmwiz-farm-profile')||'{}')}catch(e){return{}}}function voice(){var all=speechSynthesis.getVoices(),en=all.filter(function(v){return/^en([-_]|$)/i.test(v.lang)}),female=/samantha|victoria|zira|hazel|susan|karen|moira|tessa|ava|allison|fiona|serena|kate|olivia|aria|jenny|libby|siri voice 1|siri voice 2/i;return en.find(function(v){return female.test(v.name)})||all.find(function(v){return female.test(v.name)})||null}function read(text){if(!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text),v=voice();u.lang='en-US';if(v)u.voice=v;u.pitch=v?1.16:1.42;u.rate=.96;speechSynthesis.speak(u)}function render(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}async function ask(e){if(e)e.preventDefault();var text=msg.value.trim();if(!text)return;status.textContent='Reading farm evidence...';answer.innerHTML='<strong>FarmWiz</strong><br>Gathering current readings, history, crop context, and weather...';height();try{var r=await fetch('/ai/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:text,provider:provider.value,profile:profile()})});var d=await r.json();if(!r.ok)throw Error(d.detail||'Agent unavailable');last=d.answer||'';answer.innerHTML='<strong>FarmWiz · '+d.provider+'</strong><br>'+render(last);status.textContent='Answer ready';height()}catch(err){status.textContent='AI guard';answer.innerHTML='<strong>FarmWiz</strong><br>'+render(err.message);height()}}document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){msg.value=b.dataset.q;ask()}});document.getElementById('chat').onsubmit=ask;document.getElementById('speak').onclick=function(){read(last)};document.getElementById('listen').onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Voice input is not supported in this browser';return}if(!recognition){recognition=new SR();recognition.lang='en-US';recognition.onstart=function(){status.textContent='Listening...'};recognition.onresult=function(e){msg.value=Array.from(e.results).map(function(x){return x[0].transcript}).join('')};recognition.onend=function(){status.textContent='Transcript ready';height()};recognition.onerror=function(){status.textContent='Microphone unavailable'}}try{recognition.start()}catch(e){status.textContent='Voice input busy'}};if('speechSynthesis'in window)speechSynthesis.getVoices();if(typeof ResizeObserver==='function')new ResizeObserver(height).observe(document.documentElement);window.addEventListener('load',height);window.addEventListener('resize',height);height()})();</script></body></html>
