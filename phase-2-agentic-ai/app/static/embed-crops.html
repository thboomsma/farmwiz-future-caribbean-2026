<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarmWiz Crop Guide</title><style>
:root{--green:#1b5e20;--muted:#64748b;--line:#dbe5d5}*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0;background:#fff}body{font-family:Roboto,Arial,sans-serif;color:#1f2933;overflow-x:hidden}.panel{width:100%;max-width:100vw;padding:16px}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}.title{margin:3px 0 6px;color:var(--green);font-size:clamp(20px,2.4vw,28px);font-weight:700}.intro{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.add{display:flex;gap:7px;margin-top:12px}.add input{flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.add button,.research{border:0;border-radius:7px;padding:9px 13px;background:#2e7d32;color:#fff;font-weight:700;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{border:1px solid #b9d59e;border-radius:999px;padding:7px 10px;background:#f1f8e9;color:var(--green);font-size:12px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fbfcf7}.card h3{margin:0;color:var(--green);font-size:17px}.facts{margin:6px 0;color:var(--muted);font-size:12px}.card ul{margin:7px 0 0;padding-left:17px;font-size:12px;line-height:1.45}.source{margin-top:8px;color:var(--muted);font-size:11px}.empty{padding:12px;border:1px dashed #cbd5e1;border-radius:8px;color:var(--muted);font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.panel{padding:12px}.add{flex-wrap:wrap}.add>*{flex:1 1 100%}.cards{grid-template-columns:1fr}}
</style></head><body><main class="panel"><div class="eyebrow">FARMWIZ CROP GUIDE</div><div class="title">Requirements for your crops</div><p class="intro">Select one or more crops to keep advice specific to what you grow.</p><div class="add"><input id="crop" list="catalog" placeholder="Search or enter a crop"><datalist id="catalog"></datalist><button id="add" type="button">Add crop</button></div><div id="chips" class="chips"></div><div id="cards" class="cards"><div class="empty">Choose a crop to load its requirements.</div></div></main><script>
(function(){var input=document.getElementById('crop'),add=document.getElementById('add'),catalog=document.getElementById('catalog'),chips=document.getElementById('chips'),cards=document.getElementById('cards'),selected=[];function key(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}function height(){var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);if(window.parent!==window)window.parent.postMessage({type:'farmwiz-crops-resize',height:h},'https://dash.farmwiz.net')}function save(){try{var p=JSON.parse(localStorage.getItem('farmwiz-farm-profile')||'{}');p.crops=selected.slice();p.crop=selected[0]||'';localStorage.setItem('farmwiz-farm-profile',JSON.stringify(p))}catch(e){}}async function loadCatalog(){try{var r=await fetch('/ai/api/crops');var d=await r.json();(d.crops||[]).forEach(function(c){var o=document.createElement('option');o.value=String(c).replace(/_/g,' ');catalog.appendChild(o)})}catch(e){}}function renderChips(){chips.innerHTML='';selected.forEach(function(c){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=c+' ×';b.onclick=function(){selected=selected.filter(function(x){return x!==c});save();renderChips();renderCards()};chips.appendChild(b)});height()}async function renderCards(){if(!selected.length){cards.innerHTML='<div class="empty">Choose a crop to load its requirements.</div>';height();return}cards.innerHTML='<div class="empty">Loading crop requirements...</div>';var out=[];for(var i=0;i<selected.length;i++){var name=selected[i],r=await fetch('/ai/api/crops/'+encodeURIComponent(key(name)));if(r.ok){var d=await r.json();out.push('<article class="card"><h3>'+d.display_name+'</h3><div class="facts">pH '+(d.ph_range||'—')+' · Temperature '+(d.temperature_c||'—')+'°C</div><ul>'+(d.requirements||[]).map(function(x){return'<li>'+x+'</li>'}).join('')+'</ul><div class="source">'+(d.status||'Profile available')+'</div></article>')}else{out.push('<article class="card"><h3>'+name+'</h3><p class="facts">No saved profile yet.</p><button class="research" data-crop="'+key(name)+'" type="button">Ask FarmWiz to research</button></article>')}}cards.innerHTML=out.join('');cards.querySelectorAll('[data-crop]').forEach(function(b){b.onclick=async function(){b.disabled=true;b.textContent='Researching...';try{var r=await fetch('/ai/api/crops/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crop:b.dataset.crop,provider:'local_icm'})});if(!r.ok)throw Error();renderCards()}catch(e){b.textContent='Research unavailable';b.disabled=false}}});height()}add.onclick=function(){var v=input.value.trim();if(!v)return;var exists=selected.some(function(x){return key(x)===key(v)});if(!exists)selected.push(v);input.value='';save();renderChips();renderCards()};input.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();add.click()}};try{var p=JSON.parse(localStorage.getItem('farmwiz-farm-profile')||'{}');selected=Array.isArray(p.crops)?p.crops.slice():[];renderChips();renderCards()}catch(e){}loadCatalog();if(typeof ResizeObserver==='function')new ResizeObserver(height).observe(document.documentElement);window.addEventListener('load',height);height()})();</script></body></html>
